min_version = "2024.9.5"

[tools]
uv = "latest"
ruff = "latest"
ty = "latest"
prek = { version = "latest", postinstall = "prek install" }

[tasks.install]
description = "Install/update all dependencies"
alias = "i"
run = "uv sync"

[tasks.scrape]
description = "Run the scraper"
run = "uv run python -m scrape"

[tasks.server]
description = "Run the Django web app"
run = "uv run python web/manage.py runserver"

[tasks.mcp]
description = "Run the MCP server (stdio)"
run = "uv run --group mcp python -m mcp_server"

[tasks.test]
description = "Run tests"
run = "uv run --group mcp python tests/test_monticello.py && uv run --group mcp python tests/test_mcp_server.py"

[tasks.lint]
description = "Lint with ruff"
run = "ruff check ."

[tasks.ty]
description = "Type check with ty"
run = "ty check ."

[tasks.hooks]
description = "Run all git hooks"
run = "prek run"
