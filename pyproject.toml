[project]
name = "soogle"
version = "0.2.0"
description = "Smalltalk code search engine"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pymysql>=1.1",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
    "django>=4.2",
    "sqlalchemy>=2.0",
    "openai>=2.0,<3.18",
    "instructor",
    "pydantic>=2.13.5",
    "tqdm>=4.66",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
mcp = [
    "mcp>=2.2.0",
]

[tool.ruff]
line-length = 180
